<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Budget & Expense Tracker</title>

    <!-- Link the CSS file -->
    <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>

    <!-- Part 1: Page Structure -->
    <header id="page-header">
        <h1>My Budget Tracker.</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <!-- Part 2: Add Expense Section -->
        <section class="expense-section">
            <h2>Add Expense</h2>

            <div class="input-group">
                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="Enter expense name"
                >
            </div>

            <div class="input-group">
                <label for="expense-amount">Amount</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Enter amount"
                >
            </div>

            <div class="input-group">
                <label for="expense-category">Category</label>
                <input
                    type="text"
                    id="expense-category"
                    placeholder="Enter category"
                >
            </div>

            <button type="button">Add Expense</button>
        </section>

        <!-- Part 3: Your Expenses Placeholder -->
        <section id="expenses-placeholder">
            <h2>Your Expenses.</h2>
            <p>No expenses yet.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Budget Tracker</p>
    </footer>

</body>
</html>
